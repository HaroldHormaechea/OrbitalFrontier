name: android-release

# Push a tag `v X.Y.Z` (e.g. v0.1.0, v0.1.0-rc1) → build a signed release APK + AAB
# → publish them as GitHub Release assets with auto-generated changelog notes.
#
# Orbital Frontier is a single-component (Android-only) repo, so a plain `v*`
# semver tag is used. (The ai-sandbox template uses an `android-v*` prefix only
# because that repo also ships a server component on its own `server-v*` track.)
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_FILE      — base64-encoded keystore.jks
#   RELEASE_KEYSTORE_PASSWORD  — keystore password
#   RELEASE_KEY_ALIAS          — signing-key alias
#   RELEASE_KEY_PASSWORD       — signing-key password
#
# The keystore is decoded onto tmpfs (/dev/shm, RAM-backed) so it never touches
# the runner's persistent disk, and is wiped on job tear-down.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: ver
        # tag form: vX.Y.Z[-suffix]; the suffix flows into versionName, so
        # 'v0.1.0-rc1' produces a release with versionName 0.1.0-rc1.
        # versionCode is monotonic; the GitHub run number keeps it unique.
        run: |
          tag="${GITHUB_REF##*/}"
          v="${tag#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore to tmpfs
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_FILE secret is empty"
            exit 1
          fi
          mkdir -p /dev/shm/of-release
          chmod 700 /dev/shm/of-release
          printf '%s' "$KEYSTORE_B64" | base64 -d > /dev/shm/of-release/keystore.jks
          chmod 600 /dev/shm/of-release/keystore.jks
          echo "KEYSTORE_FILE_PATH=/dev/shm/of-release/keystore.jks" >> "$GITHUB_ENV"

      - name: Assemble signed APK + AAB
        env:
          # android/build.gradle.kts reads these env vars directly for the
          # release signingConfig.
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew \
              -PorbitalfrontierVersionName=${{ steps.ver.outputs.version }} \
              -PorbitalfrontierVersionCode=${{ steps.ver.outputs.code }} \
              :android:assembleRelease :android:bundleRelease \
              --no-daemon

      - name: Locate release artifacts
        id: artifacts
        run: |
          apk="$(ls android/build/outputs/apk/release/*-release*.apk | head -1)"
          aab="$(ls android/build/outputs/bundle/release/*-release*.aab | head -1)"
          if [ -z "$apk" ] || [ -z "$aab" ]; then
            echo "::error::Could not find release APK or AAB"; ls -R android/build/outputs || true; exit 1
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      - name: Verify the release APK is signed
        # apksigner verify confirms the signing config actually applied — a
        # silently-unsigned release (missing/empty secret) would otherwise ship.
        run: |
          set -eu
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "${{ steps.artifacts.outputs.apk }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Orbital Frontier ${{ steps.ver.outputs.version }}
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}
          fail_on_unmatched_files: true
          # Auto-generate the commit/PR changelog as a baseline. Do NOT hardcode a
          # static body: — it goes stale across releases. Curated per-release
          # "New features" / "Bugfixes" notes (linked to use cases) are written
          # post-publish by the project-builder `generate-release` skill, which
          # derives them from the actual diff since the previous v* tag.
          generate_release_notes: true

      - name: Wipe keystore from tmpfs
        if: always()
        run: rm -rf /dev/shm/of-release || true
